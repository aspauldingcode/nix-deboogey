name: Build and Publish Deboogey Tart VMs

# GitHub-hosted macOS runners cannot nest Apple's Virtualization framework,
# so Tart cannot boot a guest there. Dispatch this on a self-hosted Apple
# Silicon Mac (runner label in the workflow input). CI for the repo is ci.yml.
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target macOS version'
        type: choice
        options: [all, golden-gate, tahoe, sequoia, sonoma, ventura, monterey]
        default: all
      runner:
        description: 'Runner label. Hosted macos-* cannot start Tart.'
        type: string
        default: self-hosted

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Push (${{ matrix.version }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: [golden-gate, tahoe, sequoia, sonoma, ventura, monterey]

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3.24.1

      - name: Build and publish
        if: ${{ inputs.target_version == 'all' || inputs.target_version == matrix.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          support="$(sysctl -n kern.hv_support 2>/dev/null || echo 0)"
          if [ "$support" != "1" ]; then
            echo "This runner cannot start Tart (kern.hv_support=${support})."
            echo "GitHub-hosted macOS runners cannot boot a macOS guest. This job needs a self-hosted Apple Silicon runner."
            exit 1
          fi
          nix shell .#tart .#packer -c ./scripts/create-prebuilt.sh "${{ matrix.version }}" --push
