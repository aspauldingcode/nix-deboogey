name: Build and Publish Deboogey Tart VMs

# GitHub-hosted macOS runners cannot nest Apple's Virtualization framework,
# so Tart cannot boot a guest there. Dispatch this on a self-hosted Apple
# Silicon Mac (runner label in the workflow input). CI for the repo is ci.yml.
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target macOS version'
        type: choice
        options: [all, golden-gate, tahoe, sequoia, sonoma, ventura, monterey]
        default: all
      runner:
        description: 'Runner label. Hosted macos-* cannot start Tart.'
        type: string
        default: self-hosted

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Push (${{ matrix.version }})
    if: ${{ inputs.target_version == 'all' || inputs.target_version == matrix.version }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: golden-gate
            pre_26: false
          - version: tahoe
            pre_26: false
          - version: sequoia
            pre_26: true
          - version: sonoma
            pre_26: true
          - version: ventura
            pre_26: true
          - version: monterey
            pre_26: true

    steps:
      - uses: actions/checkout@v4

      - name: Require a hypervisor Tart can use
        run: |
          support="$(sysctl -n kern.hv_support 2>/dev/null || echo 0)"
          if [ "$support" != "1" ]; then
            echo "This runner cannot start Tart (kern.hv_support=${support})."
            echo "Use a self-hosted Apple Silicon Mac, or run ./scripts/create-prebuilt.sh <version> --push locally."
            exit 1
          fi

      - name: Install Tooling
        run: brew install cirruslabs/cli/tart hashicorp/tap/packer

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./scripts/create-prebuilt.sh "${{ matrix.version }}" --push
